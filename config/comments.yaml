# =====================================================================
# 코치 코멘트 자동 초안 규칙
# 각 지표의 신호등(green/yellow/red/na) 또는 조건별로 초안 문장을 고릅니다.
# {값} 자리에는 실제 수치가 들어갑니다. 코치가 Streamlit 검수 화면에서 수정한 뒤 PDF로 출력됩니다.
# =====================================================================
catch_angle:
  green: "캐치 구간에서 팔꿈치 각도 {mean:.0f}°로 하이엘보가 잘 유지되고 있습니다. 지금 느낌을 기억하세요."
  yellow: "팔꿈치 각도가 {mean:.0f}°로 권장 범위({lo}~{hi}°)에서 조금 벗어납니다. 손끝을 먼저 아래로 눌러 팔꿈치를 높게 세우는 연습이 필요합니다."
  red: "팔꿈치가 {mean:.0f}°로 많이 {direction}. 캐치 때 팔꿈치가 먼저 무너지면 물을 잡지 못하고 미끄러집니다. 스컬링 드릴로 손바닥 감각부터 다시 잡아보세요."
  direction_low: "접혀 있습니다"
  direction_high: "펴져 있습니다(스트레이트 암)"
  drills: ["프런트 스컬링", "핑거팁 드래그 드릴", "원암 자유형(하이엘보 집중)"]

split_time:
  default: "캐치 {catch_pct:.0f}% / 풀 {pull_pct:.0f}% / 피니시 {finish_pct:.0f}% / 리커버리 {recovery_pct:.0f}% 비율입니다. 사이클 평균 {cycle_sec:.2f}초."
  yellow: "좌우 구간 비율 차이가 {diff_pct:.0f}%p로 큽니다. 한쪽 팔의 풀이 짧거나 리커버리가 길어지고 있습니다. 좌우 균형을 보는 드릴을 권합니다."
  drills: ["캐치업 드릴", "메트로놈(템포 트레이너) 스윔"]

rolling:
  green: "좌 {left:.0f}° / 우 {right:.0f}° 롤링으로 적절한 범위입니다."
  yellow: "롤링이 {side} {value:.0f}°로 권장 범위({lo}~{hi}°)에서 벗어납니다. 과소 롤링은 어깨 부담, 과다 롤링은 추진 손실로 이어집니다."
  red: "좌우 롤링 차이가 {asym:.0f}°로 큽니다. 호흡 반대쪽 롤링이 부족한 경우가 많습니다. 양쪽 호흡과 사이드킥 드릴을 권합니다."
  drills: ["사이드킥 드릴", "6킥 전환 드릴", "양쪽 호흡(3스트로크)"]

hand_path:
  default: "손 궤적의 최저 깊이는 어깨 아래 {depth_str}이며, 안쪽 진입 폭은 {inward_str}입니다."
  crossover: "손이 몸 중심선을 넘어 들어옵니다(크로스오버). 어깨 라인 안쪽으로 곧게 당기는 연습이 필요합니다."
  drills: ["스컬링(캐치 포지션)", "패들 사용 풀 드릴"]

knee_hip_kick:
  green: "킥 직전 무릎 각도 {knee:.0f}°로 적절한 접힘입니다."
  yellow: "무릎 각도 {knee:.0f}°로 권장 범위({lo}~{hi}°)에서 벗어납니다."
  red: "무릎이 {knee:.0f}°까지 과도하게 접힙니다. 무릎 킥은 저항만 키웁니다. 골반에서 시작하는 웨이브를 연습하세요."
  timing_match: "{label}: 손과 킥 타이밍이 {diff_ms:+.0f}ms로 일치합니다."
  timing_off: "{label}: 킥이 손보다 {abs_ms:.0f}ms {direction}. 타이밍을 맞추면 추진이 끊기지 않습니다."
  direction_early: "빠릅니다"
  direction_late: "늦습니다"
  drills: ["수직 돌핀킥", "핀 착용 웨이브 드릴", "원암 접영(타이밍 집중)"]

breathing_speed:
  green: "호흡 시 감속률 {slowdown:.1f}%로 호흡이 속도에 거의 영향을 주지 않습니다."
  yellow: "호흡 구간에서 {slowdown:.1f}% 느려집니다. 고개를 드는 대신 롤링에 실어 돌리는 연습이 필요합니다."
  red: "호흡 구간 감속률이 {slowdown:.1f}%로 큽니다. 호흡할 때 머리가 들리면서 하체가 가라앉고 있을 가능성이 높습니다."
  drills: ["사이드킥 호흡 드릴", "스노클 스윔(자세 고정 후 비교)"]

breakout:
  match: "수중 {underwater_sec:.1f}초, 돌핀킥 {kicks}회. 첫 캐치와 머리 출수 타이밍이 {diff_ms:+.0f}ms로 일치합니다."
  hand_late: "머리가 먼저 나오고 손이 {abs_ms:.0f}ms 늦게 캐치를 시작합니다. 속도가 떨어진 뒤 스트로크가 시작되어 손해입니다."
  head_early: "머리가 먼저 수면을 뚫고 나옵니다({abs_ms:.0f}ms). 첫 스트로크로 몸을 끌어올리듯 나오는 연습을 권합니다."
  drills: ["벽차기 후 돌핀킥 3회 + 첫 스트로크 연결", "수중 브레이크아웃 반복"]

streamline:
  green: "하체 가라앉음 각도 {angle:.1f}°로 유선형이 잘 유지됩니다."
  yellow: "하체가 {angle:.1f}° 가라앉습니다. 머리를 더 눌러 넣고 시선을 아래로 두세요."
  red: "하체가 {angle:.1f}° 가라앉아 저항이 큽니다. 가슴을 누르는 느낌(프레스)과 코어 긴장이 필요합니다."
  drills: ["슈퍼맨 글라이드", "벽차기 유선형 거리 측정", "플랭크(코어)"]

general:
  unmeasured: "이 지표는 측정하지 못했습니다. 사유: {reason}"
  low_confidence: "※ 이 지표의 자동 인식 신뢰도가 {confidence:.0f}점으로 낮아 코치 검수를 거쳤습니다."
  disclaimer: "본 분석은 2D 단일 카메라 영상 기반 자동 추정치이며, 카메라 각도·수중 가시성·촬영 거리에 따라 오차가 있을 수 있습니다. 수치는 절대값보다 변화 추이와 좌우 비교에 활용하는 것을 권장합니다."
